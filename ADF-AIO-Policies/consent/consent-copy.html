<!--
Reference static web consent markup for optional use ONLY on https://ishantkohli.github.io/Web
if external embeds, web forms, or optional browser storage are ever introduced there.
The PDF (AIO) v5.3.0 Android app processes documents locally with zero analytics or tracking cookies.
-->
<section aria-labelledby="privacy-consent-title" class="privacy-consent">
  <h2 id="privacy-consent-title">Your privacy choices</h2>
  <p>
    PDF (AIO) processes documents locally on your device without tracking cookies or third-party analytics.
    On companion web pages where optional forms or embedded content exist, you may choose how
    optional browser storage is used and update your preferences at any time.
  </p>

  <div class="consent-actions">
    <button type="button" data-consent="accept-all">Accept optional</button>
    <button type="button" data-consent="reject-optional">Reject optional</button>
    <button type="button" data-consent="customize" aria-haspopup="dialog">
      Customize
    </button>
  </div>
</section>
